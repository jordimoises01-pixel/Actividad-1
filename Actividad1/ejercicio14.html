<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 14: Arreglos</title>
  <style>
    body { 
      font-family: sans-serif; 
      background: #f4f4f9; 
      display: grid; 
      place-items: center; 
      min-height: 90vh; 
      margin: 0; 
    }
    .card { 
      background: #fff; 
      padding: 20px; 
      border-radius: 8px; 
      width: 320px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
    }
    label { 
      font-weight: bold; 
      font-size: 14px; 
      margin-top: 12px; 
      display: block; 
      color: #333; 
    }
    input, button { 
      width: 100%; 
      padding: 8px; 
      margin-top: 4px; 
      box-sizing: border-box; 
      border-radius: 4px; 
      border: 1px solid #ccc; 
    }
    input[readonly] { 
      background: #e9ecef; 
      cursor: not-allowed; 
      font-weight: bold; 
    }
    button { 
      background: #fd7e14; 
      color: white; 
      border: none; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 15px; 
    }
    .error { 
      color: #dc3545; 
      font-size: 12px; 
      display: block;
      margin-top: 4px; 
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="text-align:center; margin-top:0;">Cálculos con Arreglos</h2>
    <label for="numerosInput">Números separados por comas:</label>
    <input type="text" id="numerosInput" placeholder="Ej. 10, 20, 30">
    <span id="mensajeError" class="error"></span>

    <button id="btnCalcular">Calcular</button>

    <label for="mayor">Número mayor:</label>
    <input type="text" id="mayor" readonly placeholder="...">

    <label for="menor">Número menor:</label>
    <input type="text" id="menor" readonly placeholder="...">

    <label for="promedio">Promedio:</label>
    <input type="text" id="promedio" readonly placeholder="...">
  </div>
  <<script src="/js/ejercicio14.js"></script>
</body>
</html>
