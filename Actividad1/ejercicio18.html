<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 18: Manipulación del DOM con Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
  <div class="container" style="max-width: 500px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="card-title text-center text-primary mb-4 fs-3">Agregar y Eliminar Elementos</h2>

        <div class="input-group mb-3">
          <input type="text" id="nuevoElemento" class="form-control" placeholder="Escribe algo" aria-label="Nuevo elemento">
          <button class="btn btn-primary" type="button" id="agregarBtn">Agregar</button>
        </div>

        <ul id="lista" class="list-group"></ul>
      </div>
    </div>
  </div>
  <script src="ejercicio18.js"></script>
</body>
</html>
