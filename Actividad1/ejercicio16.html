<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 16: Funciones Flecha</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { 
      font-family: sans-serif; 
      background: #f4f4f9; 
      display: grid; 
      place-items: center; 
      min-height: 90vh; 
      margin: 0; 
    }
    .card { 
      background: #fff; 
      padding: 20px; 
      border-radius: 8px; 
      width: 320px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
    }
    label { 
      font-weight: bold; 
      font-size: 14px; 
      margin-top: 12px; 
      display: block; 
      color: #333; 
    }
    input, button { 
      width: 100%; 
      padding: 8px;
       margin-top: 4px; 
       box-sizing: border-box; 
       border-radius: 4px; 
       border: 1px solid #ccc; 
      }
    input[readonly] { 
      background: #e9ecef; 
      cursor: not-allowed; 
      font-weight: bold; 
    }
    .grid-botones { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 8px; 
      margin-top: 15px; 
      margin-bottom: 12px; 
    }
    .grid-botones button { 
      margin-top: 0; 
      background: #007bff; 
      color: white; 
      border: none; 
      font-weight: bold; 
      cursor: pointer; 
      padding: 10px; 
    }
    .grid-botones button:hover { 
      background: #0056b3; 
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="text-align:center; margin-top:0;">Calculadora Básica</h2>
    
    <label for="numero1">Número 1:</label>
    <input type="text" id="numero1" placeholder="Ej. 15">

    <label for="numero2">Número 2:</label>
    <input type="text" id="numero2" placeholder="Ej. 5">

    <div class="grid-botones">
      <button type="button" id="btnSuma">Sumar (+)</button>
      <button type="button" id="btnResta">Restar (-)</button>
      <button type="button" id="btnMulti">Multiplicar (*)</button>
      <button type="button" id="btnDiv">Dividir (/)</button>
    </div>

    <label for="resultado">Resultado:</label>
    <input type="text" id="resultado" readonly placeholder="Resultado">
  </div>
  <script src="ejercicio16.js"></script>
</body>
</html>
